<!doctype html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>uNAS 演示</title>
  </head>
  <body>
    <div id="root">
      <main style="display:grid;min-height:100vh;place-items:center;padding:24px;background:#0a0e1a;color:#e2e8f0;font:16px system-ui,sans-serif">
        <p role="status">正在启动 uNAS Demo…</p>
      </main>
    </div>
    <div id="window-portal"></div>
    <script type="module">
      const root = document.getElementById('root')
      const showStartupError = (error) => {
        const message = error instanceof Error ? error.message : String(error)
        root.innerHTML = `
          <main style="display:grid;min-height:100vh;place-items:center;padding:24px;background:#0a0e1a;color:#e2e8f0;font:16px system-ui,sans-serif">
            <section style="max-width:640px;padding:28px;border:1px solid #7f1d1d;border-radius:16px;background:#1f1115">
              <h1 style="margin:0 0 12px">uNAS Demo 启动失败</h1>
              <p style="line-height:1.6">请重新加载页面；若问题持续，请重新构建并重新加载扩展。</p>
              <pre style="margin:16px 0 0;white-space:pre-wrap;color:#fecaca">${message}</pre>
            </section>
          </main>`
      }
      window.addEventListener('error', (event) => showStartupError(event.error || event.message), { once: true })
      window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason), { once: true })
      import('../../src/main.tsx').catch(showStartupError)
    </script>
  </body>
</html>

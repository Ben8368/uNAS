name: CodeQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'filters/**'
      - 'assets/**'
      - 'pnpm-lock.yaml'
      - '**/package-lock.json'
      - 'apps/extension/public/credential-core.wasm'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'filters/**'
      - 'assets/**'
      - 'pnpm-lock.yaml'
      - '**/package-lock.json'
      - 'apps/extension/public/credential-core.wasm'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for code scanning. No pull_request_target, write to contents,
# or pull-request merge capability is granted.
permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # A pull_request from a fork receives a read-only token and cannot upload
    # results. Same-repository PRs are scanned; fork PRs are covered by the
    # push scan after merge. No privileged pull_request_target workflow is used.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            queries: security-extended
          - language: actions
            build-mode: none
            queries: security-extended
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.queries }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

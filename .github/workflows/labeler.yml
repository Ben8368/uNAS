name: PR Labeler

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Labeling only. No pull_request_target, contents write, or merge permission.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply path labels
    # pull_request from a fork has a read-only token. Do not switch to
    # pull_request_target; fork PRs are labeled by a maintainer if needed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false

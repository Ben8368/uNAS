name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate governance docs
        run: node scripts/governance-docs-check.mjs

  verify-extension:
    name: Verify uNAS host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run host verification
        run: pnpm verify:extension

  # The internal password compatibility package needs no second repository or deploy key.
  verify-password-compat:
    name: Verify password compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust credential core toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run password compatibility verification
        run: pnpm verify:password-compat

  password-compat-dependency-audit:
    name: uNAS Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit Cargo.lock with RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/password-compat/credential-core

  password-compat-release-checks:
    name: Password compatibility checks (WASM, Chrome smoke, hardened)
    # Internal compatibility release-quality checks: run on main, manual dispatch, and PRs that touch the package.
    needs: [verify-password-compat, password-compat-dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect password compatibility changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- packages/password-compat scripts/credential-core-provenance.mjs apps/extension/public/credential-core.wasm; then
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Chrome for MV3 smoke test
        if: steps.scope.outputs.run == 'true'
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-dependencies: true

      - name: Set up Rust credential core toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Install pinned Binaryen
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          BINARYEN_VERSION: "131"
          BINARYEN_SHA256: "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          binaryen_bin="$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin"
          echo "$binaryen_bin" >> "$GITHUB_PATH"
          export PATH="$binaryen_bin:$PATH"
          wasm-opt --version

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify tracked WASM against a source rebuild and reproducibility
        if: steps.scope.outputs.run == 'true'
        run: |
          node scripts/credential-core-provenance.mjs --rebuild
          pnpm --filter @unas/password-compat run verify:wasm-reproducible

      # Does not relax the check above: on a mismatch it regenerates the artifact with this same pinned pipeline in
      # the ephemeral checkout and uploads it, so a maintainer can review and commit the Linux-built bytes.
      - name: Regenerate tracked WASM for review on provenance mismatch
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        run: node scripts/credential-core-provenance.mjs --write

      - name: Upload regenerated WASM and its record
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: regenerated-credential-core
          path: |
            apps/extension/public/credential-core.wasm
            assets/demo-assets.json
          if-no-files-found: error

      # smoke:chrome loads the internal test shell, not a separately released product.
      - name: Build internal test shell for Chrome smoke
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @unas/password-compat run build

      - name: Run automated Chrome smoke and hardened build
        if: steps.scope.outputs.run == 'true'
        env:
          UNAS_HARDEN_SEED: ci-hardened-v1
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_SMOKE_NO_SANDBOX: "true"
          CHROME_SMOKE_SKIP_RESTART: "true"
        run: |
          xvfb-run --auto-servernum pnpm --filter @unas/password-compat run smoke:chrome
          xvfb-run --auto-servernum pnpm --filter @unas/password-compat run verify:hardened

  e2e:
    name: Browser regression
    needs: verify-extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir apps/extension exec playwright install --with-deps chromium

      - name: Run MV3 extension regression
        run: pnpm test:e2e

      - name: Run Web regression
        run: pnpm --dir apps/extension run test:e2e:web

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            apps/extension/playwright-report/
            apps/extension/test-results/
          if-no-files-found: ignore
          retention-days: 14

version: 2

updates:
  # The root pnpm workspace and lockfile include apps/extension.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

# packages/unipass is a pnpm workspace member, so the root entry above updates it and pnpm-lock.yaml.
# Its package-lock.json (standalone npm ci/audit only) is regenerated from that result by
# `npm install --package-lock-only` inside packages/unipass; `pnpm unipass:lock:check` fails on drift.
# Rust: credential-core is audited by RustSec in CI; Cargo updates stay manual because the WASM is byte-reproducibility gated.

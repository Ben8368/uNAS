version: 2

updates:
  # The root pnpm workspace and lockfile include apps/extension.
  # Update policy and maintainer steps: docs/ADR/0022-dependabot-maintenance.md.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 4
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: build
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      build-toolchain-minor-patch:
        dependency-type: development
        patterns:
          - vite
          - "@vitejs/*"
          - wxt
          - esbuild
          - vitest
          - "@playwright/*"
          - puppeteer-core
        update-types:
          - minor
          - patch
      tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

# packages/password-compat is a pnpm workspace member, so the root entry above updates it and pnpm-lock.yaml.
# Its package-lock.json exists for package-level npm audit only. After a dependency change, maintainers run
# `npm install --package-lock-only --ignore-scripts` inside packages/password-compat, then reconcile any drift
# with `pnpm password-compat:lock:check`; npm resolution alone does not guarantee parity with pnpm.
# Rust: credential-core is audited by RustSec in CI; Cargo updates stay manual because the WASM is byte-reproducibility gated.
